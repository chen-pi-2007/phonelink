plugins { id 'com.android.application' }
// 签名证书放在私有仓库 chen-pi-2007/keys 的 phonelink/ 下，本机克隆在 D:	ool\keys
def keysDir = file(System.getenv('PHONELINK_KEYS_DIR') ?: 'D:/tool/keys/phonelink')
def keyPass = new File(keysDir, 'pass.txt').with { it.exists() ? it.text.trim() : null }

android {
    namespace 'com.phonelink.bridge'
    compileSdk 34
    defaultConfig {
        applicationId 'com.phonelink.bridge'
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName '0.7.2'
    }
    signingConfigs {
        release {
            storeFile new File(keysDir, 'phonelink.jks')
            storePassword keyPass
            keyAlias 'phonelink'
            keyPassword keyPass
        }
    }
    buildTypes {
        // debug 也用正式证书，保证两种包能互相覆盖安装
        debug { signingConfig signingConfigs.release }
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
