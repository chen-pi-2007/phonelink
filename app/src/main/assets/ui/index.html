<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>手机副屏</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg"></canvas>
  <canvas id="gl"></canvas>

  <!-- 顶部常驻：时钟 + 闹钟 + 连接状态 -->
  <header id="topbar">
    <div class="clock"><span id="clock">--:--</span><span id="alarm" class="alarm hidden"></span></div>
    <div class="top-right">
      <div id="conn" class="conn">未连接</div>
      <button id="gear" class="gear" aria-label="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <!-- 导航插播提示条（停在音乐页时从顶部滑下） -->
  <div id="nav-pill" class="nav-pill">
    <img id="pill-icon" alt=""><div class="pill-text"><b id="pill-dist"></b><span id="pill-road"></span></div>
  </div>

  <main id="pages">
    <!-- 第 1 页：音乐 -->
    <section class="page page-music">
      <div id="sources" class="sources"></div>
      <!-- 正在播放：小封面 + 歌名（Apple Music 歌词页式布局，把空间留给歌词） -->
      <div class="now">
        <div id="cover-wrap" class="cover-wrap">
          <div id="cover" class="cover"><img id="cover-img" alt=""><div class="cover-ph shimmer"></div></div>
        </div>
        <div class="meta">
          <div id="title" class="title">未连接</div>
          <div id="artist" class="artist"></div>
        </div>
      </div>
      <div id="lyrics" class="lyrics"><div id="lyrics-inner"></div></div>
      <div class="progress"><div id="bar"><i id="bar-fill"></i></div>
        <div class="times"><span id="t-pos">0:00</span><span id="t-dur">0:00</span></div></div>
      <div class="controls">
        <button data-cmd="seekBy" data-v="-15000" class="small">−15</button>
        <button data-cmd="prev"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12 18 18V6z"/></svg></button>
        <button data-cmd="toggle" class="play"><svg viewBox="0 0 24 24"><path id="pp" d="M8 5v14l11-7z"/></svg></button>
        <button data-cmd="next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></button>
        <button data-cmd="seekBy" data-v="15000" class="small">+15</button>
      </div>
    </section>

    <!-- 第 2 页：导航 -->
    <section class="page page-nav">
      <div id="nav-empty" class="nav-empty">主手机未在导航<br><small>上滑回到音乐</small></div>
      <div id="nav-live" class="nav-live hidden">
        <div class="turn"><img id="nav-icon" alt=""><svg id="nav-arrow" viewBox="0 0 24 24"><path d="M12 3 5 10h4v11h6V10h4z"/></svg></div>
        <div id="nav-dist" class="nav-dist"></div>
        <div id="nav-road" class="nav-road"></div>
        <div id="nav-sub" class="nav-sub"></div>
      </div>
    </section>
  </main>

  <div id="dots" class="dots"><i class="on"></i><i></i></div>
  <!-- 设置面板：点右上角连接标签打开 -->
  <div id="settings" class="sheet">
    <div class="sheet-card">
      <div class="sheet-title">设置</div>
      <div class="theme-label">主题</div>
      <div id="themes" class="themes">
        <div class="theme" data-t="flow"><i class="sw sw-flow"></i>流光</div>
        <div class="theme" data-t="galaxy"><i class="sw sw-galaxy"></i>星河</div>
        <div class="theme" data-t="vinyl"><i class="sw sw-vinyl"></i>黑胶</div>
        <div class="theme" data-t="mono"><i class="sw sw-mono"></i>日光</div>
      </div>
      <div class="theme-label">3D 主题（真立体，耗电略高）</div>
      <div class="themes">
        <div class="theme" data-t="dust"><i class="sw sw-dust"></i>封面星尘</div>
        <div class="theme" data-t="nebula"><i class="sw sw-nebula"></i>星云隧道</div>
        <div class="theme" data-t="rain"><i class="sw sw-rain"></i>雨夜霓虹</div>
        <div class="theme ghost"></div>
      </div>
      <div class="theme-label">平面主题</div>
      <div class="themes">
        <div class="theme" data-t="halo"><i class="sw sw-halo"></i>光晕</div>
        <div class="theme" data-t="planet"><i class="sw sw-planet"></i>行星</div>
        <div class="theme" data-t="tunnel"><i class="sw sw-tunnel"></i>隧道</div>
        <div class="theme ghost"></div>
      </div>
      <div class="theme-label">歌词样式</div>
      <div class="themes seg">
        <div class="lmode" data-m="list">列表</div>
        <div class="lmode" data-m="stage">舞台</div>
      </div>
      <div class="row"><span>主手机</span><b id="set-host">未连接</b></div>
      <div class="row"><span>主手机版本</span><b id="set-hostver">-</b></div>
      <button id="set-hostupd" class="sheet-btn amber hidden">让主手机更新</button>
      <div class="row"><span>副屏版本</span><b id="set-myver">-</b></div>
      <button id="set-pick" class="sheet-btn">切换主手机</button>
      <button id="set-update" class="sheet-btn">检查更新</button>
      <button id="set-close" class="sheet-btn ghost">关闭</button>
    </div>
  </div>

  <!-- 连接界面：雷达波纹 + 手机图标 -->
  <div id="offline" class="offline show">
    <div class="radar">
      <i></i><i></i><i></i>
      <svg class="radar-phone" viewBox="0 0 24 24"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 3v13h10V5H7zm4 14.5a1 1 0 1 0 2 0 1 1 0 0 0-2 0z"/></svg>
      <svg class="radar-slash" viewBox="0 0 24 24"><path d="M4 4 20 20" stroke-width="2.4" stroke-linecap="round"/></svg>
    </div>
    <div id="offline-title" class="off-title">正在寻找主手机</div>
    <div id="offline-text" class="off-text">蓝牙连接中…</div>
    <div class="off-hint">请确认：主手机蓝牙已开启 · “手机副屏”在后台运行</div>
    <button id="reconnect" class="sheet-btn reconnect hidden">重新连接</button>
  </div>

  <canvas id="intro"></canvas>

  <script src="js/lyrics.js"></script>
  <script src="js/gesture.js"></script>
  <script src="js/bus.js"></script>
  <script src="lib/three.min.js"></script>
  <script src="js/bg.js"></script>
  <script src="js/gl.js"></script>
  <script src="js/music.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/demo.js"></script>
</body>
</html>
