<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>手机副屏</title>
<style>
  /* 克制的系统设置风：纯黑底、靠字号分层、只有一个强调色。兼容旧内核（不用 inset / gap / aspect-ratio） */
  :root { --fg: #f2f2f2; --dim: #8a8a8e; --line: #1f1f22; --accent: #5ac8fa; --warn: #ffb340; --ok: #34c759; --ease: cubic-bezier(.2,.8,.2,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #000; color: var(--fg); overflow: hidden;
    font-family: "PingFang SC","MiSans","Noto Sans SC",system-ui,sans-serif; }
  button, *:focus { outline: none; }
  .view { position: absolute; top: 0; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: max(14px, env(safe-area-inset-top)) 22px 40px;
    background: #000; transition: transform .38s var(--ease); }

  /* ---------- 首页 ---------- */
  .bar { display: flex; align-items: center; justify-content: space-between; height: 44px; }
  .brand { font-size: 15px; color: var(--dim); letter-spacing: .5px; }
  .gear { width: 40px; height: 40px; margin-right: -8px; display: flex; align-items: center; justify-content: center; }
  .gear svg { width: 22px; height: 22px; stroke: var(--fg); fill: none; stroke-width: 1.8; }

  .status { margin-top: 48px; }
  .status h1 { font-size: 44px; font-weight: 700; letter-spacing: -.5px; line-height: 1.1; }
  .status h1 i { display: inline-block; width: 12px; height: 12px; border-radius: 6px; margin: 0 0 8px 12px; vertical-align: middle; background: var(--dim); }
  .status p { font-size: 17px; color: var(--dim); margin-top: 10px; line-height: 1.5; }
  .issue { display: none; margin-top: 18px; font-size: 16px; color: var(--warn); }
  .issue.show { display: block; }
  .issue b { font-weight: 600; }

  .now { margin-top: 56px; padding-top: 22px; border-top: 1px solid var(--line); }
  .label { font-size: 13px; color: var(--dim); letter-spacing: 1px; }
  .track { display: flex; align-items: center; margin-top: 14px; }
  .art { flex: none; width: 64px; height: 64px; border-radius: 10px; background: #161618 center/cover no-repeat; margin-right: 16px; }
  .track .t { min-width: 0; }
  .track b { display: block; font-size: 19px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track span { display: block; font-size: 14px; color: var(--dim); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { margin-top: 14px; font-size: 16px; color: var(--dim); }
  .foot { position: fixed; left: 22px; right: 22px; bottom: max(18px, env(safe-area-inset-bottom)); font-size: 13px; color: #555; }

  /* ---------- 设置页（从右侧滑入） ---------- */
  #settings { transform: translateX(100%); }
  body.in-settings #settings { transform: none; }
  body.in-settings #home { transform: translateX(-24%); }
  .back { display: flex; align-items: center; height: 44px; font-size: 17px; color: var(--accent); }
  .back svg { width: 22px; height: 22px; stroke: var(--accent); fill: none; stroke-width: 2; margin-left: -6px; }
  .title { font-size: 32px; font-weight: 700; margin: 8px 0 6px; }
  .group { font-size: 13px; color: var(--dim); letter-spacing: 1px; margin: 30px 0 4px; }
  .row { display: flex; align-items: center; min-height: 56px; border-bottom: 1px solid var(--line); }
  .row:active { opacity: .6; }
  .row .k { flex: 1; font-size: 17px; }
  .row .k small { display: block; font-size: 13px; color: var(--dim); margin-top: 2px; }
  .row .v { font-size: 15px; color: var(--dim); }
  .row .v.ok { color: var(--ok); }
  .row .v.todo { color: var(--warn); }
  .row .v.new { color: var(--accent); }
  .chev { width: 7px; height: 7px; border-right: 1.6px solid #555; border-top: 1.6px solid #555; transform: rotate(45deg); margin-left: 10px; }
  .sw { width: 46px; height: 28px; border-radius: 14px; background: #2c2c2e; position: relative; transition: background .25s; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 12px; background: #fff; transition: transform .28s var(--ease); }
  .sw.on { background: var(--ok); }
  .sw.on::after { transform: translateX(18px); }
  .meta { font-size: 13px; color: #555; margin-top: 28px; line-height: 1.7; }
  .toast { position: fixed; left: 50%; bottom: 60px; transform: translate(-50%, 20px); opacity: 0; padding: 11px 18px; border-radius: 12px;
    background: #2c2c2e; font-size: 15px; transition: opacity .25s, transform .3s var(--ease); pointer-events: none; z-index: 9; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
  <!-- 首页：只说清楚现在的状况 + 正在同步的内容 -->
  <div class="view" id="home">
    <div class="bar">
      <span class="brand">手机副屏 · 主手机</span>
      <div class="gear" id="open-settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></div>
    </div>

    <div class="status">
      <h1 id="st-title">…<i id="st-dot"></i></h1>
      <p id="st-text"></p>
      <div class="issue" id="issue"></div>
    </div>

    <div class="now">
      <div class="label">正在同步</div>
      <div class="track" id="track" style="display:none">
        <div class="art" id="art"></div>
        <div class="t"><b id="now-title"></b><span id="now-sub"></span></div>
      </div>
      <div class="empty" id="now-empty">没有在播放</div>
    </div>

    <div class="foot" id="foot"></div>
  </div>

  <!-- 设置页 -->
  <div class="view" id="settings">
    <div class="back" id="close-settings"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>返回</div>
    <div class="title">设置</div>

    <div class="group">权限</div>
    <div class="row" data-act="openListener"><div class="k">通知使用权<small>读取正在播放的歌和导航</small></div><span class="v" id="p-listener"></span><i class="chev"></i></div>
    <div class="row" data-act="reqBt"><div class="k">蓝牙</div><span class="v" id="p-bt"></span><i class="chev"></i></div>
    <div class="row" data-act="battery"><div class="k">忽略电池优化<small>防止被系统杀掉</small></div><span class="v" id="p-battery"></span><i class="chev"></i></div>
    <div class="row" data-act="appDetails"><div class="k">后台运行与自启动<small>vivo 需要手动允许</small></div><i class="chev"></i></div>
    <div class="row" data-act="reqBeat"><div class="k">律动<small>可选，不会录音</small></div><span class="v" id="p-beat"></span><i class="chev"></i></div>

    <div class="group">更新</div>
    <div class="row" id="upd"><div class="k" id="upd-k">检查更新</div><span class="v" id="upd-v"></span><i class="chev"></i></div>

    <div class="group">其他</div>
    <div class="row" id="hide"><div class="k">从最近任务中隐藏</div><i class="sw" id="hide-sw"></i></div>
    <div class="row" data-act="beatTest"><div class="k">律动测试</div><i class="chev"></i></div>
    <div class="row" data-act="copyNavLog"><div class="k">复制导航诊断记录</div><i class="chev"></i></div>
    <div class="row" data-act="switchMode"><div class="k">切换为副屏模式</div><i class="chev"></i></div>

    <div class="meta" id="meta"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  var N = window.PLNative, $ = function (id) { return document.getElementById(id); };
  function toast(t) { var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove('show'); }, 2200); }
  function perm(id, ok, optional) {
    var el = $(id);
    el.textContent = ok ? '已开启' : (optional ? '未开启' : '去开启');
    el.className = 'v ' + (ok ? 'ok' : optional ? '' : 'todo');
  }
  var lastArt = '';

  function render() {
    var s = JSON.parse(N.status());
    // 状态：一句大字 + 一句说明
    var title, text, dot;
    if (!s.listener) { title = '还不能用'; text = '需要先开启通知使用权'; dot = 'var(--warn)'; }
    else if (s.svc.indexOf('已连接') === 0) { title = '已连接'; text = s.display ? '正在同步到 ' + s.display : '正在同步到副屏'; dot = 'var(--ok)'; }
    else if (s.svc.indexOf('待机') === 0) { title = '待机中'; text = '副屏打开后会自动连上'; dot = 'var(--accent)'; }
    else { title = '需要处理'; text = s.svc; dot = 'var(--warn)'; }
    $('st-title').firstChild.nodeValue = title;
    $('st-dot').style.background = dot;
    $('st-text').textContent = text;
    // 只在有问题时提示一行
    var issue = !s.listener ? '开启通知使用权' : !s.bt ? '授予蓝牙权限' : !s.battery ? '关闭电池优化，防止被杀' : '';
    $('issue').classList.toggle('show', !!issue);
    $('issue').innerHTML = issue ? '<b>' + issue + '</b>　去设置 ›' : '';
    // 正在同步的内容
    var has = !!s.nowTitle;
    $('track').style.display = has ? 'flex' : 'none';
    $('now-empty').style.display = has ? 'none' : 'block';
    if (has) {
      $('now-title').textContent = s.nowTitle;
      $('now-sub').textContent = [s.nowArtist, s.nowApp].filter(Boolean).join(' · ');
      if (s.nowArt !== lastArt) { lastArt = s.nowArt; $('art').style.backgroundImage = s.nowArt ? 'url(data:image/jpeg;base64,' + s.nowArt + ')' : ''; }
    }
    $('foot').textContent = s.svc.indexOf('已连接') === 0 ? '' : '后台待机：不联网，几乎不耗电';
    // 设置页
    perm('p-listener', s.listener); perm('p-bt', s.bt); perm('p-battery', s.battery); perm('p-beat', s.beat, true);
    $('hide-sw').classList.toggle('on', s.hide);
    if (!$('upd-v').textContent) $('upd-v').textContent = 'v' + s.ver;
    $('meta').innerHTML = '手机副屏 v' + s.ver + '<br>安卓 ' + s.android + ' · ' + s.model;
  }

  $('open-settings').onclick = function () { document.body.classList.add('in-settings'); };
  $('close-settings').onclick = function () { document.body.classList.remove('in-settings'); };
  $('issue').onclick = function () { document.body.classList.add('in-settings'); };
  document.addEventListener('click', function (e) { var it = e.target.closest('[data-act]'); if (it && N[it.dataset.act]) N[it.dataset.act](); });
  $('hide').onclick = function () { var on = !$('hide-sw').classList.contains('on'); N.setHide(on); $('hide-sw').classList.toggle('on', on); };
  $('upd').onclick = function () { N.updateClick(); };
  window.PLS = {
    toast: toast,
    onUpdate: function (title, sub, isNew) { $('upd-k').textContent = title; $('upd-v').textContent = sub || ''; $('upd-v').className = 'v' + (isNew ? ' new' : ''); },
    back: function () { if (document.body.classList.contains('in-settings')) { document.body.classList.remove('in-settings'); return true; } return false; }
  };
  render();
  setInterval(render, 1500);
})();
</script>
</body>
</html>
